[project]
name = "kochbuch-backend"
version = "0.1.0"
description = "Kochbuch – recipe manager backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
  "socksio>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "recipe-scrapers==15.12.0",
  "pillow>=13.0.0",
  "blurhash>=1.1.5",
  "beautifulsoup4>=4.15.0",
  "bring-api>=1.1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
]

[project.optional-dependencies]
# Optional browser TLS fingerprint impersonation for stubborn sites.
fetch = ["curl_cffi>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
