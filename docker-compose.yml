services:
  kochbuch:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: kochbuch:latest
    container_name: kochbuch
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      # WICHTIG: eigenen Wert erzeugen, z. B.
      #   openssl rand -hex 32
      # Alle Werte sind über die .env / Dokploy-Environment überschreibbar,
      # die Angaben nach den `:-` sind nur die Defaults.
      SECRET_KEY: "${SECRET_KEY:-change-me-please}"
      EMBED_PUBLIC: "${EMBED_PUBLIC:-true}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      # Home Assistant darf die Seite als iframe einbetten
      # frame-ancestors * → beliebige Ursprünge erlaubt.
      FRAME_ANCESTORS: "${FRAME_ANCESTORS:-*}"
      TZ: "${TZ:-Europe/Berlin}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
    volumes:
      # SQLite-Datenbank + Rezeptbilder
      - kochbuch-data:/app/data

volumes:
  kochbuch-data:
